<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420">
  <rect width="960" height="420" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" rx="8"/>

  <!-- Title & Subtitle -->
  <text x="480" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">
    图 2: C3D20T/C3D10T 二阶热-力耦合实体网格剖分与单元质量审计云图 (Mesh Discretization)
  </text>
  <text x="480" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">
    全模型 48,650 节点 &bull; 39,820 实体单元 &bull; 管壁 3 层六面体单元 (t=6mm) &bull; R4 汇流圆角 1.2mm 局部细化 &bull; 畸变单元 0 个 (0.00%)
  </text>

  <!-- Left Canvas: Mesh Layout -->
  <g transform="translate(40, 60)">
    <rect width="570" height="330" fill="#0f172a" stroke="#cbd5e1" stroke-width="1" rx="6"/>

    <!-- Cylinder Head Mesh Block -->
    <rect x="30" y="250" width="510" height="55" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8"/>
    <!-- Mesh lines on Head -->
    <g stroke="#334155" stroke-width="0.6">
      <line x1="30" y1="268" x2="540" y2="268"/>
      <line x1="30" y1="286" x2="540" y2="286"/>
      <line x1="80" y1="250" x2="80" y2="305"/>
      <line x1="130" y1="250" x2="130" y2="305"/>
      <line x1="180" y1="250" x2="180" y2="305"/>
      <line x1="230" y1="250" x2="230" y2="305"/>
      <line x1="285" y1="250" x2="285" y2="305"/>
      <line x1="340" y1="250" x2="340" y2="305"/>
      <line x1="390" y1="250" x2="390" y2="305"/>
      <line x1="440" y1="250" x2="440" y2="305"/>
      <line x1="490" y1="250" x2="490" y2="305"/>
    </g>

    <!-- Manifold Flange Solid Mesh -->
    <rect x="30" y="210" width="510" height="30" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1"/>
    <!-- Flange Mesh Grid (3 layers across 18mm thickness) -->
    <g stroke="#38bdf8" stroke-width="0.7">
      <line x1="30" y1="220" x2="540" y2="220"/>
      <line x1="30" y1="230" x2="540" y2="230"/>
      <!-- Vertical lines -->
      <line x1="60" y1="210" x2="60" y2="240"/>
      <line x1="90" y1="210" x2="90" y2="240"/>
      <line x1="120" y1="210" x2="120" y2="240"/>
      <line x1="150" y1="210" x2="150" y2="240"/>
      <line x1="180" y1="210" x2="180" y2="240"/>
      <line x1="210" y1="210" x2="210" y2="240"/>
      <line x1="240" y1="210" x2="240" y2="240"/>
      <line x1="270" y1="210" x2="270" y2="240"/>
      <line x1="300" y1="210" x2="300" y2="240"/>
      <line x1="330" y1="210" x2="330" y2="240"/>
      <line x1="360" y1="210" x2="360" y2="240"/>
      <line x1="390" y1="210" x2="390" y2="240"/>
      <line x1="420" y1="210" x2="420" y2="240"/>
      <line x1="450" y1="210" x2="450" y2="240"/>
      <line x1="480" y1="210" x2="480" y2="240"/>
      <line x1="510" y1="210" x2="510" y2="240"/>
    </g>

    <!-- 4 Mesh Runners -->
    <!-- Runner 1 -->
    <path d="M 75 210 L 75 140 Q 75 100 160 90 L 260 75" fill="none" stroke="#2563eb" stroke-width="26" stroke-linecap="round"/>
    <path d="M 75 210 L 75 140 Q 75 100 160 90 L 260 75" fill="none" stroke="#93c5fd" stroke-width="16" stroke-linecap="round"/>
    <path d="M 75 210 L 75 140 Q 75 100 160 90 L 260 75" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="4,4"/>

    <!-- Runner 2 -->
    <path d="M 195 210 L 195 145 Q 195 110 240 90 L 270 75" fill="none" stroke="#2563eb" stroke-width="26" stroke-linecap="round"/>
    <path d="M 195 210 L 195 145 Q 195 110 240 90 L 270 75" fill="none" stroke="#93c5fd" stroke-width="16" stroke-linecap="round"/>
    <path d="M 195 210 L 195 145 Q 195 110 240 90 L 270 75" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="4,4"/>

    <!-- Runner 3 -->
    <path d="M 375 210 L 375 145 Q 375 110 330 90 L 300 75" fill="none" stroke="#2563eb" stroke-width="26" stroke-linecap="round"/>
    <path d="M 375 210 L 375 145 Q 375 110 330 90 L 300 75" fill="none" stroke="#93c5fd" stroke-width="16" stroke-linecap="round"/>
    <path d="M 375 210 L 375 145 Q 375 110 330 90 L 300 75" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="4,4"/>

    <!-- Runner 4 -->
    <path d="M 495 210 L 495 140 Q 495 100 410 90 L 310 75" fill="none" stroke="#2563eb" stroke-width="26" stroke-linecap="round"/>
    <path d="M 495 210 L 495 140 Q 495 100 410 90 L 310 75" fill="none" stroke="#93c5fd" stroke-width="16" stroke-linecap="round"/>
    <path d="M 495 210 L 495 140 Q 495 100 410 90 L 310 75" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="4,4"/>

    <!-- Confluence Collector Box (Fine Mesh) -->
    <rect x="255" y="35" width="60" height="42" fill="#1e3a8a" stroke="#38bdf8" stroke-width="1" rx="3"/>
    <g stroke="#93c5fd" stroke-width="0.8">
      <line x1="255" y1="49" x2="315" y2="49"/>
      <line x1="255" y1="63" x2="315" y2="63"/>
      <line x1="275" y1="35" x2="275" y2="77"/>
      <line x1="295" y1="35" x2="295" y2="77"/>
    </g>

    <!-- Fillet Local Refinement Rings (Green Circles showing 1.2mm local seed) -->
    <circle cx="255" cy="85" r="16" fill="none" stroke="#22c55e" stroke-width="2"/>
    <circle cx="315" cy="85" r="16" fill="none" stroke="#22c55e" stroke-width="2"/>

    <!-- Callout 1: Fillet Mesh Zoom -->
    <g transform="translate(180, 15)">
      <rect width="210" height="28" fill="#14532d" stroke="#22c55e" rx="4"/>
      <text x="105" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#dcfce7" text-anchor="middle">
        汇流圆角局部细化: 1.2 mm 二阶四面体 C3D10T
      </text>
    </g>

    <!-- Callout 2: Wall Thickness Hex Layers -->
    <g transform="translate(50, 85)">
      <rect width="180" height="28" fill="#1e3a8a" stroke="#60a5fa" rx="4"/>
      <text x="90" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#dbeafe" text-anchor="middle">
        支管壁厚: 3 层实体六面体 C3D8RT
      </text>
    </g>

    <!-- Bottom Status Bar -->
    <rect x="60" y="306" width="450" height="18" fill="#14532d" stroke="#22c55e" rx="3"/>
    <text x="285" y="319" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="bold" fill="#dcfce7" text-anchor="middle">
      网格质量门禁核验通过: 雅可比比值 0.68 &ge; 0.60 &bull; 宽高比 4.12 &le; 4.50 (Gate 6 PASS)
    </text>
  </g>

  <!-- Right Quality Card -->
  <g transform="translate(630, 60)">
    <rect width="290" height="330" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="6"/>
    <text x="145" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">
      有限元网格质量核查指标
    </text>
    <line x1="20" y1="36" x2="270" y2="36" stroke="#e2e8f0" stroke-width="1"/>

    <g transform="translate(18, 50)" font-family="system-ui, -apple-system, sans-serif" font-size="11">
      <text y="0" font-weight="bold" fill="#334155">单元类型与公式</text>
      <text y="16" fill="#64748b">热场单元: DC3D8 (六面体) / DC3D10</text>
      <text y="30" fill="#64748b">力场单元: C3D8RT (减缩积分) / C3D10MT</text>
      <text y="44" fill="#64748b">全域单元总数: 39,820 elements</text>
      <text y="58" fill="#64748b">全域节点总数: 48,650 nodes</text>

      <text y="86" font-weight="bold" fill="#334155">单元质量审计指标</text>
      <text y="102" fill="#16a34a" font-weight="bold">最小雅可比比值: 0.68 (&ge; 0.60 门槛, 合格)</text>
      <text y="118" fill="#16a34a" font-weight="bold">最大单元长宽比: 4.12 (&le; 4.50 门槛, 合格)</text>
      <text y="134" fill="#16a34a" font-weight="bold">严重畸变单元数: 0 单元 (0.00% 占比)</text>
      <text y="150" fill="#16a34a" font-weight="bold">最大翘曲角: 11.4&deg; (&le; 15.0&deg; 门槛, 合格)</text>

      <text y="178" font-weight="bold" fill="#334155">几何特征离散分辨率</text>
      <text y="194" fill="#64748b">管壁厚度层数: 3 层 (满足弯曲应变梯度)</text>
      <text y="208" fill="#64748b">支管标称网格尺寸: 3.5 mm</text>
      <text y="222" fill="#64748b">汇流倒角细化尺寸: 1.2 mm (R4圆角)</text>
      <text y="236" fill="#64748b">螺栓孔周向细化: 每圈 24 个单元</text>

      <text y="262" font-weight="bold" fill="#334155">网格收敛性状态</text>
      <text y="278" fill="#64748b">GCI 离散误差指数: &le; 2.8% (网格无关性达标)</text>
    </g>
  </g>
</svg>