name: CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run pytest with strict warnings
        run: python -c "import subprocess, sys; res = subprocess.run([sys.executable, '-m', 'pytest', '-W', 'error', '--tb=short', '-q'], capture_output=True, text=True); print(res.stdout); print(res.stderr, file=sys.stderr); [print('::error title=Pytest Error::' + line) for line in (res.stdout + res.stderr).splitlines() if 'FAILED' in line or 'ERROR' in line or 'AssertionError' in line or 'Error:' in line][:10]; sys.exit(res.returncode)"
      - name: Verify CLI entrypoint and commands
        run: |
          abaqus-ai-agent --help
          abaqus-ai-agent matrix --list
          abaqus-ai-agent fmbd --case fmbd7 --verify-topology
          abaqus-ai-agent fmbd --case fmbd7 --compile
          abaqus-agent inspect --json
          abaqus-agent ask "对100mm悬臂梁端部施加1000N垂直载荷，材料为结构钢，固定根部，校核端部挠度不超过2.5mm。" --dry-run
      - name: Run Golden Evidence & Release Quality Audits
        run: |
          python tools/run_golden_matrix.py --validate-evidence all
          python tools/i6_release_audit.py
          python tools/i1_engineering_case_matrix.py
          python tools/i2_failure_matrix.py
          python tools/i3_reproducibility.py
          python tools/m_engineering_task_matrix.py
