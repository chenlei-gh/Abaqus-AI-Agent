name: CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run pytest with strict warnings
        run: python -m pytest -W error -q
      - name: Verify CLI entrypoint and commands
        run: |
          abaqus-ai-agent --help
          abaqus-ai-agent matrix --list
          abaqus-ai-agent fmbd --case fmbd7 --verify-topology
          abaqus-ai-agent fmbd --case fmbd7 --compile
